[project]
name = "hmc-backend"
version = "0.1.0"
description = "Humans in Minecraft — Workflow 2 backend: capture ingress, calibration, reconstruction, and CharacterFrame publication."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "opencv-contrib-python>=4.10",
    # Pinned: mediapipe 1.0.x macOS wheels abort inside TensorsToDetectionsCalculator
    # ("Check failed: service_ Service is unavailable", Metal helper) for both the
    # Pose and Hand landmarkers in IMAGE mode, CPU or GPU delegate. 0.10.14 is the
    # newest release verified to run the pinned .task models on macOS arm64.
    "mediapipe==0.10.14",
    "sentry-sdk>=2.0",
]

[project.scripts]
hmc-backend = "hmc_backend.main:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hmc_backend"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
