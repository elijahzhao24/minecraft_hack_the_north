plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'io.sentry.jvm.gradle' version '6.22.0'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the Fabric, Mojang and Maven Central repositories automatically.
	mavenCentral()
}

configurations {
	sentryAgent
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"humancraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Sentry (Tracing + Logs). Bundled into the mod jar via Loom's jar-in-jar.
	implementation "io.sentry:sentry:${project.sentry_version}"
	include "io.sentry:sentry:${project.sentry_version}"
	implementation "io.sentry:sentry-async-profiler:${project.sentry_version}"
	include "io.sentry:sentry-async-profiler:${project.sentry_version}"
	sentryAgent "io.sentry:sentry-opentelemetry-agent:${project.sentry_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

sentry {
	includeSourceContext = true
	org = "jonathan-zhu"
	projectName = "java-minecraft"
	authToken = System.getenv("SENTRY_AUTH_TOKEN")
}

// Local builds create the bundle but upload only when the developer supplied
// an organization token explicitly.
tasks.named('sentryUploadSourceBundleJava').configure {
	onlyIf { System.getenv("SENTRY_AUTH_TOKEN") != null }
}

// The development launcher gets the same OpenTelemetry agent used by a packaged launch.
// Resolution remains lazy, so ordinary compilation does not start or attach an agent.
tasks.named('runClient').configure {
	doFirst {
		jvmArgs "-javaagent:${configurations.sentryAgent.singleFile.absolutePath}"
		environment "SENTRY_PROPERTIES_FILE", file("sentry.properties").absolutePath
		// Sentry installs its own span processor. Disable the agent's unrelated
		// default OTLP exporters; HumanCraft sends telemetry via the Sentry SDK.
		environment "OTEL_TRACES_EXPORTER", "none"
		environment "OTEL_LOGS_EXPORTER", "none"
		environment "OTEL_METRICS_EXPORTER", "none"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Sentry contributes generated source metadata that is included in sourcesJar.
// Gradle 9 requires the producer tasks to be declared explicitly.
tasks.named('sourcesJar').configure {
	dependsOn tasks.named('collectExternalDependenciesForSentry')
	dependsOn tasks.named('generateSentryDebugMetaPropertiesjava')
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}
}

// Writes the golden synthetic fixture (.hmc + decoded summary + sha256) into ../contracts/fixtures.
tasks.register('writeFixtures', JavaExec) {
	group = 'humancraft'
	description = 'Regenerate the deterministic HMC1 CHARACTER_FRAME fixtures under contracts/fixtures.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'dev.humancraft.fixture.FixtureWriter'
	args = [project.rootDir.toPath().resolve('../contracts/fixtures').toAbsolutePath().normalize().toString()]
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
